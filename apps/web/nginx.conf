# Serves the built SPA and proxies /api into the api container.
#
# The /api proxy lives here rather than in the host Caddy so the container topology is
# self-contained: Caddy only needs to know about one upstream (this container), and its
# config stays a one-line reverse_proxy. Move it to the edge if Caddy ever needs to do
# auth or rate limiting on API traffic — that would be the reason to, not this.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress on the fly. The bundle is already minified; this is the cheap win on
    # top of that. text/html is always compressed by nginx and must not be listed.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # Hashed filenames, so these can be cached indefinitely — a content change produces
    # a new filename rather than a stale hit.
    # One directive, not `expires 1y` plus an add_header: those emit two separate
    # Cache-Control headers (max-age=31536000, then public/immutable) and which one
    # wins is left to the client. Verified with curl -D-.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /api/ {
        # `api` is the compose service name, resolved by Docker's embedded DNS on the
        # shared network. Trailing slash omitted on the upstream on purpose: the API
        # mounts its routes under /api/v1, so the path must be forwarded unmodified.
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Appends rather than replaces, so the host Caddy's own header survives and the
        # API sees the real client IP at the end of the chain.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # index.html itself must never be cached: it is the document that points at the
    # hashed bundles, so a stale copy pins the browser to a deleted build.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback — client-side routing means /services/svc-auth-001 is a real route
    # to React but not a file on disk. Without this, a hard refresh on any deep link 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
