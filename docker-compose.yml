services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: daleelex
      POSTGRES_PASSWORD: daleelex
      POSTGRES_DB: daleelex
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daleelex -d daleelex"]
      interval: 5s
      timeout: 5s
      retries: 10

  jenkins:
    image: jenkins/jenkins:lts
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home

  backend:
    build:
      context: backend
      dockerfile: Dockerfile
      args:
        APP_PORT: ${APP_PORT:-3000}
    environment:
      NODE_ENV: development
    env_file:
      - ./backend/.env
    ports:
      - "${APP_PORT:-3000}:${APP_PORT:-3000}"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data:
  jenkins_home: