services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: daleelex
      POSTGRES_PASSWORD: daleelex
      POSTGRES_DB: daleelex
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  jenkins:
    image: jenkins/jenkins:lts
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home

volumes:
  pg_data:
  jenkins_home:
