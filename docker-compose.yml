# Base topology, shared by dev and prod. On its own this file is closest to a prod
# shape: no bind mounts, and no host ports for the app services.
#
#   dev   docker compose up            (docker-compose.override.yml is auto-loaded)
#   prod  docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Caddy is NOT here on purpose — it stays on the host reverse-proxying into these
# containers, so TLS and certificate renewal keep working exactly as they do today.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: daleelex
      POSTGRES_PASSWORD: daleelex
      POSTGRES_DB: daleelex
    # api waits on this rather than on the container merely existing — Postgres
    # accepts TCP connections a beat before it will answer queries, and without the
    # gate the API loses that race on a cold start and exits.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U daleelex -d daleelex']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [daleelex]

  api:
    # Both `image` and `build` on purpose: dev builds locally and tags it with this
    # name, prod overrides `image` to the published GHCR tag and never builds.
    image: ghcr.io/daleelex/daleelex-api:${DALEELEX_TAG:-dev}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      # Container-to-container, so the service name `postgres` and the *internal* 5432
      # — unaffected by whatever the host happens to have bound on its own 5432.
      DATABASE_URL: postgresql://daleelex:daleelex@postgres:5432/daleelex
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      # Optional at boot: the affected features report a clear error instead of the
      # process refusing to start. See .env.docker.example.
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      DALEELEX_ENCRYPTION_KEY: ${DALEELEX_ENCRYPTION_KEY:-}
      DALEELEX_ADMIN_API_TOKEN: ${DALEELEX_ADMIN_API_TOKEN:-}
      JENKINS_BASE_URL: ${JENKINS_BASE_URL:-}
      JENKINS_USERNAME: ${JENKINS_USERNAME:-}
      JENKINS_API_TOKEN: ${JENKINS_API_TOKEN:-}
      LOKI_URL: ${LOKI_URL:-}
      LOKI_SERVICE_LABEL: ${LOKI_SERVICE_LABEL:-}
    # There is no curl or wget in the runtime image, and adding a package purely to
    # poll one URL is not worth the layer — Node 20 has fetch built in.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    networks: [daleelex]

  web:
    image: ghcr.io/daleelex/daleelex-web:${DALEELEX_TAG:-dev}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Vite inlines VITE_* at build time, so this is a build arg, not a runtime env
        # var — the built image is pinned to whichever Clerk instance it was built
        # against. Publishable, not secret.
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-}
    # nginx serves the bundle and proxies /api to the api service, so this is the only
    # container the host Caddy needs to know about.
    depends_on:
      api:
        condition: service_healthy
    networks: [daleelex]

  ingestor:
    image: ghcr.io/daleelex/daleelex-ingestor:${DALEELEX_TAG:-dev}
    build:
      context: .
      dockerfile: apps/ingestor/Dockerfile
    # A one-shot job, not a service: it scans repositories, syncs TechDocs and exits.
    # The profile keeps it out of `docker compose up` — without it, compose would start
    # the container on every `up`, watch it exit 0, and report it as stopped, which
    # reads like a crash. `docker compose run` activates the profile on its own, so the
    # documented invocation still works:
    #
    #   docker compose run --rm ingestor
    #
    # Caveat that follows from the profile: `docker compose up --build` only builds
    # services in an ACTIVE profile, so this one is skipped and `run` silently reuses
    # whatever image is already tagged. After changing its Dockerfile, build it
    # explicitly or you are testing the previous image:
    #
    #   docker compose build ingestor
    #
    # A one-shot here: with INGEST_INTERVAL_MINUTES unset it runs once and exits.
    # The pm2 deploy sets that variable in ecosystem.config.cjs to keep it running
    # on a schedule instead.
    profiles: [ingestor]
    restart: 'no'
    # List form, and the optional vars are bare on purpose. `VAR: ${VAR:-}` would set
    # them to the empty STRING when unset, which is not the same as unset: the ingestor
    # defaults GITHUB_API_URL through a default parameter and DOCS_SYNC_REF through `??`,
    # and both of those only fall back on undefined. An empty string wins over the
    # default and yields a relative URL — "Failed to parse URL from /repos/...". A bare
    # name omits the variable entirely when it has no value, which is what these want.
    environment:
      - DATABASE_URL=postgresql://daleelex:daleelex@postgres:5432/daleelex
      # Without a token the run is a documented no-op (logs techdocs.skipped, exits 0)
      # rather than a failure.
      - GITHUB_TOKEN
      - GITHUB_API_URL
      - DOCS_SYNC_REF
    depends_on:
      postgres:
        condition: service_healthy
    networks: [daleelex]

networks:
  daleelex:
    driver: bridge

volumes:
  pg_data:
