# Dev-only overrides. Compose loads this file automatically, so plain
# `docker compose up` is the dev command and prod has to opt out by naming its files
# explicitly. Nothing here should ever be true in production.
#
# The bind-mount pattern below is the same for every service:
#
#   - ./apps/<app>:/repo/apps/<app>   source, so a host edit reaches the container
#   - ./packages/shared:/repo/...     shared types, edited just as often
#   - /repo/apps/<app>/node_modules   ANONYMOUS volume, and the important one
#
# That third line masks the host's node_modules with the container's own install.
# Without it the bind mount shadows the image's node_modules with whatever is on the
# host — a macOS arm64 tree containing native binaries (esbuild, rollup, Prisma
# engines) that cannot execute under Linux musl.
#
# The tradeoff: anonymous volumes SURVIVE `docker compose up --build`, so after a
# dependency change or a re-run of `prisma generate` they hold a stale tree and the
# rebuilt image's node_modules never appears. Symptoms are confusing — a module that
# is definitely installed reported missing, or a Prisma engine that was definitely
# regenerated still the old one. Renew them explicitly:
#
#   docker compose up -d --build -V        # -V == --renew-anon-volumes

services:
  postgres:
    # Published so host-side tooling keeps working unchanged — `pnpm db:migrate`,
    # `pnpm db:seed`, and psql all point at localhost:5432. Prod does not publish it:
    # only the api container needs to reach the database there.
    ports:
      - '5432:5432'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      # The build stage still has tsx, the dev dependencies and the full workspace;
      # the default runtime stage has only the pruned production tree and no watcher.
      target: build
    # tsx watch restarts the process on save. --host is not needed here (Fastify
    # already binds 0.0.0.0 in src/index.ts) but the container must not inherit the
    # image CMD, which runs the compiled dist/ that bind-mounted source never rebuilds.
    command: pnpm --filter @daleelex/api dev
    working_dir: /repo
    volumes:
      - ./apps/api:/repo/apps/api
      - ./packages/shared:/repo/packages/shared
      - /repo/apps/api/node_modules
      - /repo/packages/shared/node_modules
      - /repo/node_modules
    environment:
      - NODE_ENV=development
    ports:
      # Published so the API can be curled directly while debugging, and so host-side
      # Playwright/e2e can reach it. Prod keeps it internal to the compose network.
      - '3000:3000'

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      # Vite dev server rather than nginx-over-static — hot module replacement is the
      # entire point of the dev loop, and the nginx stage serves a frozen build.
      target: dev
    volumes:
      - ./apps/web:/repo/apps/web
      - ./packages/shared:/repo/packages/shared
      - /repo/apps/web/node_modules
      - /repo/packages/shared/node_modules
      - /repo/node_modules
    environment:
      # NOT baked in dev: `vite dev` reads VITE_* at process start, so unlike the
      # production image this container is not pinned to one Clerk instance. Falls
      # back to apps/web/.env, which is bind-mounted in with the rest of apps/web.
      - VITE_CLERK_PUBLISHABLE_KEY
      # Inside the container `localhost` is the web container itself, so the Vite
      # proxy has to address the API by its compose service name.
      - API_PROXY_TARGET=http://api:3000
    ports:
      - '5173:5173'

  ingestor:
    build:
      context: .
      dockerfile: apps/ingestor/Dockerfile
      target: build
    command: pnpm --filter @daleelex/ingestor sync
    working_dir: /repo
    volumes:
      - ./apps/ingestor:/repo/apps/ingestor
      - ./packages/shared:/repo/packages/shared
      - /repo/apps/ingestor/node_modules
      - /repo/packages/shared/node_modules
      - /repo/node_modules
    environment:
      - NODE_ENV=development
