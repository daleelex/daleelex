name: CI

on:
  pull_request:
  push:
    branches: [master]

# A new push to the same PR/branch supersedes the previous run — no point
# burning runner minutes finishing a check on code that's already stale.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Matches docker-compose.yml's local Postgres creds — same DB shape in CI as in dev.
  DATABASE_URL: postgresql://daleelex:daleelex@localhost:5432/daleelex

jobs:
  # Independent jobs so a lint failure doesn't wait behind typecheck/tests, and vice versa.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # corepack ships with Node 20 and reads the `packageManager` field in package.json
      # to install the exact pinned pnpm version — no third-party action needed for this.
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # @prisma/client's postinstall (which normally runs `prisma generate`) doesn't
      # reliably fire under pnpm --frozen-lockfile in CI — confirmed by reproducing it
      # locally with a from-scratch node_modules. Without this, the client's types fall
      # back to an ungenerated stub, and every un-annotated callback over a Prisma query
      # result (services.map(...), teams.filter(...), etc.) becomes implicit any (TS7006).
      - run: pnpm --filter @daleelex/api exec prisma generate
      - run: pnpm typecheck

  # Covers both plain unit tests and DB-backed ones in a single job: nothing in the
  # codebase currently distinguishes the two (one test file exists today, and it doesn't
  # touch the DB), so a Postgres-less "unit" job would just be a strict subset of this one
  # for no real benefit. Worth splitting later once there's an actual reason to.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: daleelex
          POSTGRES_PASSWORD: daleelex
          POSTGRES_DB: daleelex
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # See the typecheck job for why this is explicit rather than relying on postinstall.
      # migrate deploy on its own does not generate the client either.
      - run: pnpm --filter @daleelex/api exec prisma generate
      - run: pnpm --filter @daleelex/api exec prisma migrate deploy
      - run: pnpm -r test

  # Runs on every PR, not just main — the suite is currently a single Chromium smoke test
  # (~seconds, once the browser binary is cached), and with no staging environment, catching
  # an e2e break before merge is much cheaper than catching it after it's already live on the
  # one production VM. Revisit if the suite grows past a few minutes or gets flaky.
  e2e:
    runs-on: ubuntu-latest
    # The smoke test asserts Clerk's real login page renders, so ClerkProvider has to
    # boot against a live instance — a synthetic key won't do, it just throws.
    #
    # Gated on the repo not being a fork, NOT on the variable being set. Gating on the
    # variable looks safer but is worse: repo variables (unlike secrets) ARE exposed to
    # fork pull requests, so the variable is nearly always present anyway, and the one
    # thing that condition reliably caught was the maintainer setting the value as a
    # *secret* by mistake — which silently skipped the job on this repo instead of
    # failing it. Here e2e always runs, and a missing variable fails loudly.
    #
    # A fork running CI on its own repo (push to its master) has no Clerk instance of
    # its own, so it skips rather than failing for a reason the contributor can't fix;
    # setting the variable in the fork is not required but does opt them back in.
    if: github.event.repository.fork == false || vars.VITE_CLERK_PUBLISHABLE_KEY_CI != ''
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: daleelex
          POSTGRES_PASSWORD: daleelex
          POSTGRES_DB: daleelex
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Publishable, not secret — pk_ keys are meant to ship in client bundles, so this
      # is a repo *variable* (Settings → Secrets and variables → Actions → Variables),
      # not a secret. It lives there rather than inline so the public repo isn't
      # hardcoded to one maintainer's Clerk instance. Vite bakes VITE_* in at build
      # time, so the web build below needs it present or the app throws on boot.
      #
      # Deliberately a DIFFERENT variable from the pk_live_ key cd.yml uses, and it must
      # hold a Clerk *development*-instance key (pk_test_). The e2e suite serves the app
      # from http://localhost:4173; Clerk production instances are bound to their
      # configured domain over HTTPS, so a pk_live_ key cannot initialise there —
      # ClerkJS never loads, <Show when="signed-in"> never resolves, and the redirect
      # the smoke test asserts never happens. Development instances are the ones that
      # permit localhost. Pointing this at the production key is what broke this job.
      VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY_CI }}
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # See the typecheck job for why this is explicit — without it, `api build` below
      # fails on the same missing-types errors typecheck would.
      - run: pnpm --filter @daleelex/api exec prisma generate
      - run: pnpm --filter @daleelex/api exec prisma migrate deploy
      - run: pnpm --filter @daleelex/api exec prisma db seed
      - run: pnpm --filter @daleelex/api build
      - run: pnpm --filter @daleelex/web build
      # The architecture is web → API → DB, never web → DB directly, so the e2e run
      # exercises the real API rather than a preview server proxying into nothing.
      - name: Start API in the background
        run: pnpm --filter @daleelex/api start &
        env:
          DATABASE_URL: postgresql://daleelex:daleelex@localhost:5432/daleelex
      - name: Wait for API health check
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/v1/health && exit 0
            sleep 1
          done
          echo "API did not become healthy within 30s" >&2
          exit 1
      # Cache the downloaded browser binary (not node_modules — pnpm's own cache already
      # covers that) so repeat runs skip the ~100MB Chromium download.
      - name: Cache Playwright browser binary
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Playwright Chromium
        run: pnpm --filter @daleelex/web exec playwright install --with-deps chromium
        # Skip the browser download on a cache hit, but always run --with-deps once per
        # runner image so OS-level shared libraries are still present after a cache restore.
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: pnpm --filter @daleelex/web exec playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - run: pnpm --filter @daleelex/web e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # Publishes the container images to GHCR. Only on merge to master, never on a pull
  # request: PRs from forks get a read-only GITHUB_TOKEN, and publishing an image built
  # from unreviewed code under the org's namespace is not something a PR should be able
  # to do. Gated behind the full check suite so `latest` always points at a commit that
  # passed everything.
  images:
    needs: [lint, typecheck, test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      # Default for GITHUB_TOKEN is read-only; pushing packages needs this explicitly.
      # No PAT or registry secret required, unlike Docker Hub.
      contents: read
      packages: write
    strategy:
      # One job per image so a web failure doesn't hide an api failure, and the three
      # (each building two architectures) run concurrently rather than end to end.
      fail-fast: false
      matrix:
        app: [api, web, ingestor]
    steps:
      - uses: actions/checkout@v4

      # The web Dockerfile guards this too, but that guard fires deep into an emulated
      # multi-arch build — several minutes in. Checked here so a missing variable costs
      # seconds. Same reasoning (and same variable) as cd.yml's pre-build check.
      - name: Require a Clerk publishable key
        if: matrix.app == 'web'
        run: |
          if [ -z "${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}" ]; then
            echo "vars.VITE_CLERK_PUBLISHABLE_KEY is unset — set it under Settings →" >&2
            echo "Secrets and variables → Actions → Variables. Vite bakes VITE_* into" >&2
            echo "the bundle at build time, so the published web image would throw on" >&2
            echo "boot. Production should use a pk_live_ key." >&2
            exit 1
          fi

      # linux/arm64 is the production VM (Oracle Ampere) and the runner is x86-64, so
      # that half of every build runs under emulation. Without this, buildx fails
      # outright on the foreign platform rather than falling back to anything.
      - uses: docker/setup-qemu-action@v3
      # The default builder uses the `docker` driver, which cannot emit multi-platform
      # manifests — it quietly produces the runner's architecture only, so the VM would
      # fail at pull time rather than here. This sets up a docker-container builder.
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both the git SHA and latest, per image. The SHA tag is what a deploy should
      # pin to — DALEELEX_TAG in docker-compose.prod.yml has no default precisely so
      # that deploying names an exact commit.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/daleelex/daleelex-${{ matrix.app }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          # Repo root, not the app directory: pnpm needs the workspace root and the
          # lockfile to resolve @daleelex/shared at all.
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Emulated arm64 builds are slow; without a cache every merge repeats the
          # full dependency install for both architectures. scope is per-app so the
          # three matrix legs don't evict each other's entries.
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          # Only the web image consumes this — Vite inlines VITE_* at build time, so
          # the key cannot be supplied later as a container env var and the published
          # web image is pinned to this Clerk instance. Same production pk_live_
          # variable cd.yml uses; the api reads CLERK_SECRET_KEY at runtime instead.
          # Harmless on the other two, whose Dockerfiles declare no such ARG.
          build-args: |
            VITE_CLERK_PUBLISHABLE_KEY=${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
